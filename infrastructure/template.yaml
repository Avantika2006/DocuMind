
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: DocuMind - Serverless Document Q&A Infrastructure

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

Resources:

  # 1. S3 bucket for uploaded PDF documents
  DocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - GET
              - PUT
              - HEAD
            AllowedOrigins:
              - '*'
            MaxAge: 3600

  # 2. DynamoDB table for document metadata
  DocumentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'DocuMind-Documents-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: documentId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: documentId
          KeyType: RANGE

  # 3. DynamoDB table for extracted document chunks
  ChunksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'DocuMind-Chunks-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: documentId
          AttributeType: S
        - AttributeName: chunkId
          AttributeType: S
      KeySchema:
        - AttributeName: documentId
          KeyType: HASH
        - AttributeName: chunkId
          KeyType: RANGE

  # 4. Dead-letter queue for failed ingestion jobs
  IngestionDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'DocuMind-Ingestion-DLQ-${Environment}'
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  # 5. Main document ingestion queue
  IngestionQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'DocuMind-Ingestion-${Environment}'
      VisibilityTimeout: 180
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt IngestionDeadLetterQueue.Arn
        maxReceiveCount: 3

Outputs:

  DocumentsBucketName:
    Description: S3 bucket for uploaded documents
    Value: !Ref DocumentsBucket

  DocumentsTableName:
    Description: DynamoDB documents table
    Value: !Ref DocumentsTable

  ChunksTableName:
    Description: DynamoDB chunks table
    Value: !Ref ChunksTable

  IngestionQueueUrl:
    Description: SQS ingestion queue URL
    Value: !Ref IngestionQueue

  IngestionQueueArn:
    Description: SQS ingestion queue ARN
    Value: !GetAtt IngestionQueue.Arn
