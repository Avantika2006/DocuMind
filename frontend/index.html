<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocuMind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    /* Old library: parchment pages, walnut shelves, oxblood bindings, brass fittings */
    --parchment: #F2E8D5;
    --parchment-deep: #E7D8BC;
    --ink: #2B1E16;
    --muted: #6E5A48;
    --rule: #D3BF9B;
    --oxblood: #6E1F27;
    --oxblood-text: #6E1F27;
    --cite-ink: #6E1F27;
    --glow: rgba(255, 255, 255, 0.28);
    --oxblood-ink: #F6EEDC;
    --walnut: #3B2A1E;
    --walnut-hi: #4B3727;
    --side-ink: #EFE3CA;
    --side-muted: #BDA785;
    --brass: #B08D3C;
    --brass-soft: rgba(176, 141, 60, 0.26);
    --brass-ink: #7A5F1F;
    --ok: #6F8A3E;
    --bad: #A33A2F;
    --display: 'Cormorant Garamond', Garamond, Georgia, serif;
    --sans: 'Lato', system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(ellipse at 60% 0%, var(--glow), transparent 60%), var(--parchment);
    color: var(--ink); font: 15px/1.55 var(--sans);
  }
  button, textarea, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

  .app { display: grid; grid-template-columns: minmax(300px, 25%) 1fr; height: 100dvh; }

  /* ---------- Library (left): the walnut shelf ---------- */
  .library { background: var(--walnut); color: var(--side-ink); display: flex; flex-direction: column; padding: 28px 26px; gap: 18px; overflow-y: auto; }
  .brand { display: flex; gap: 12px; align-items: center; padding-bottom: 18px; border-bottom: 1px solid rgba(176, 141, 60, 0.45); }
  .brand svg { color: var(--brass); flex: none; }
  .brand h1 { font: 700 1.9rem/1 var(--display); margin: 0; letter-spacing: 0.01em; }
  .brand p { margin: 4px 0 0; color: var(--side-muted); font: italic 500 1rem/1.25 var(--display); }

  .drop { display: block; border: 1px dashed var(--brass); border-radius: 4px; padding: 16px; cursor: pointer; background: rgba(255, 255, 255, 0.03); transition: background .15s; }
  .drop:hover, .drop.over { background: rgba(176, 141, 60, 0.12); }
  .drop strong { display: block; font: 600 1.2rem/1.2 var(--display); }
  .drop span { color: var(--side-muted); font-size: 0.8125rem; }
  .progress { height: 3px; background: rgba(255, 255, 255, 0.12); margin-top: 12px; overflow: hidden; }
  .progress div { height: 100%; width: 0; background: var(--brass); transition: width .2s; }
  .up-msg { margin: -8px 2px 0; font-size: 0.8125rem; color: var(--side-muted); min-height: 1.2em; }
  .up-msg.error { color: #E89A8F; }

  .lib-title { font: italic 600 1.15rem var(--display); color: var(--brass); margin: 4px 2px -8px; }
  .docs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .doc { width: 100%; text-align: left; background: none; border: 0; border-radius: 3px; padding: 10px 10px 10px 14px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; cursor: pointer; color: var(--side-ink); }
  .doc:hover:not(:disabled) { background: var(--walnut-hi); }
  .doc[aria-current="true"] { background: var(--walnut-hi); box-shadow: inset 3px 0 0 var(--brass); }
  .doc:disabled { cursor: default; opacity: 0.6; }
  .doc-name { font-weight: 700; font-size: 0.9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doc-sub { grid-column: 1; font: italic 500 0.95rem var(--display); color: var(--side-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doc-sub.error { color: #E89A8F; }
  .dot { grid-column: 2; grid-row: 1 / span 2; align-self: center; width: 7px; height: 7px; border-radius: 50%; background: var(--brass); }
  .dot.READY { background: #8FA85A; }
  .dot.FAILED { background: #D0685C; }
  .dot.PROCESSING, .dot.UPLOADING { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .empty-lib { color: var(--side-muted); font: italic 500 1rem var(--display); padding: 4px 2px; }
  .stack { margin-top: auto; font-size: 0.75rem; color: var(--side-muted); }

  /* ---------- Reader (right): the open page ---------- */
  .reader { display: grid; grid-template-rows: auto 1fr auto; min-height: 0; }
  .reader-head { padding: 24px 40px 16px; border-bottom: 1px solid var(--rule); display: flex; align-items: baseline; gap: 14px; }
  .reader-head h2 { font: italic 600 1.9rem/1.2 var(--display); margin: 0; color: var(--oxblood-text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .reader-head .pages { color: var(--muted); font: italic 500 1.05rem var(--display); white-space: nowrap; }
  .reader-head .clear { margin-left: auto; background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 0.8125rem; padding: 4px 6px; border-radius: 3px; }
  .reader-head .clear:hover { color: var(--oxblood-text); }

  .thread { overflow-y: auto; padding: 32px 40px 48px; }
  .thread-inner { max-width: 700px; margin: 0 auto; display: flex; flex-direction: column; gap: 30px; }

  .welcome { max-width: 540px; margin: 11vh auto 0; text-align: center; }
  .welcome::before { content: '❦'; display: block; color: var(--brass); font-size: 1.8rem; margin-bottom: 10px; }
  .welcome h3 { font: 600 2.5rem/1.15 var(--display); margin: 0 0 12px; }
  .welcome p { color: var(--muted); margin: 0; font: italic 500 1.2rem/1.5 var(--display); }
  .suggest { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 26px; }
  .suggest button { background: transparent; border: 1px solid var(--brass); border-radius: 3px; padding: 6px 14px; cursor: pointer; font: italic 600 1.05rem var(--display); color: var(--ink); }
  .suggest button:hover { background: var(--brass-soft); }

  .q { font: italic 600 1.35rem/1.35 var(--display); color: var(--oxblood-text); padding-left: 16px; border-left: 2px solid var(--brass); }
  .a { font: 500 1.25rem/1.6 var(--display); }
  .a p { margin: 0 0 0.7em; }
  .a ul, .a ol { margin: 0 0 0.7em; padding-left: 1.3em; }
  .a li { margin: 0.15em 0; }
  .a li::marker { color: var(--brass); }
  .a strong { font-weight: 700; }
  .a code { font: 0.8em var(--sans); background: var(--parchment-deep); padding: 1px 5px; border-radius: 3px; }
  .a .note { font: 0.875rem var(--sans); color: var(--brass-ink); margin-bottom: 8px; }
  .a.error { font: 0.9375rem var(--sans); color: var(--bad); }
  .thinking { font: italic 500 1.15rem var(--display); color: var(--muted); }
  .thinking::after { content: ''; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }

  /* Citations: brass-ruled marginal references */
  .cite { font: 700 0.62em var(--sans); letter-spacing: 0.03em; color: var(--cite-ink); background: var(--brass-soft); border: 0; border-bottom: 1.5px solid var(--brass); border-radius: 2px; padding: 1px 5px; margin: 0 2px; cursor: pointer; vertical-align: 0.15em; }
  .cite:hover { background: var(--brass); color: var(--oxblood-ink); }

  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
  .pill { font-size: 0.72rem; color: var(--muted); border: 1px solid var(--rule); border-radius: 3px; padding: 2px 8px; }

  .sources { margin-top: 14px; }
  .sources summary { cursor: pointer; font-size: 0.8125rem; color: var(--muted); font-weight: 700; }
  .sources summary:hover { color: var(--oxblood-text); }
  .src-list { display: grid; gap: 8px; margin-top: 10px; }
  .src { background: var(--parchment-deep); border-left: 3px solid var(--brass); border-radius: 0 4px 4px 0; padding: 10px 16px; }
  .src-head { display: flex; align-items: center; gap: 10px; font-size: 0.8125rem; font-weight: 700; color: var(--oxblood-text); }
  .bar { flex: 0 0 60px; height: 3px; background: var(--rule); overflow: hidden; }
  .bar div { height: 100%; background: var(--brass); }
  .src p { margin: 6px 0 0; font: 500 1.05rem/1.5 var(--display); color: var(--muted); }
  .src.flash { animation: flash 1.4s ease-out; }
  @keyframes flash { 0% { box-shadow: 0 0 0 3px var(--brass); } 100% { box-shadow: 0 0 0 3px transparent; } }

  /* ---------- Composer ---------- */
  .composer { border-top: 1px solid var(--rule); padding: 14px 40px 18px; }
  .composer-inner { max-width: 700px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; background: var(--parchment-deep); border: 1px solid var(--rule); border-radius: 4px; padding: 8px 8px 8px 14px; }
  .composer-inner:focus-within { border-color: var(--brass); }
  .composer textarea { flex: 1; border: 0; background: none; resize: none; outline: none; padding: 6px 0; max-height: 160px; font: 500 1.15rem/1.45 var(--display); }
  .composer textarea::placeholder { color: var(--muted); font-style: italic; }
  .send { background: var(--oxblood); color: var(--oxblood-ink); border: 0; border-radius: 3px; padding: 9px 18px; font-weight: 700; letter-spacing: 0.02em; cursor: pointer; }
  .send:hover:not(:disabled) { filter: brightness(1.12); }
  .send:disabled { opacity: .45; cursor: default; }
  .hint { max-width: 700px; margin: 6px auto 0; font-size: 0.75rem; color: var(--muted); }

  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; height: auto; min-height: 100dvh; }
    .stack { display: none; }
    .reader { min-height: 80dvh; }
    .reader-head, .thread, .composer { padding-left: 16px; padding-right: 16px; }
    .welcome { margin-top: 32px; }
    .welcome h3 { font-size: 2rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="library">
    <header class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
        <rect x="6" y="3" width="22" height="28" rx="3" fill="none" stroke="currentColor" stroke-width="2"/>
        <rect x="10" y="12" width="14" height="5" rx="1" fill="currentColor" opacity="0.55"/>
        <line x1="10" y1="22" x2="24" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <line x1="10" y1="9" x2="19" y2="9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <div>
        <h1>DocuMind</h1>
        <p>Ask your PDFs. Every answer cites its pages.</p>
      </div>
    </header>

    <label class="drop" id="drop" tabindex="0">
      <input type="file" id="file" accept="application/pdf" hidden>
      <strong>Add a PDF</strong>
      <span>Drop a file here or click to browse. Text-based PDFs up to 10 MB.</span>
      <div class="progress" id="progress" hidden><div></div></div>
    </label>
    <p class="up-msg" id="upMsg" role="status"></p>

    <h2 class="lib-title">Library</h2>
    <ul class="docs" id="docs"><li class="empty-lib">Loading your documents</li></ul>

    <p class="stack">Serverless on AWS Lambda, S3, DynamoDB and API Gateway</p>
  </aside>

  <main class="reader">
    <header class="reader-head" id="head"></header>
    <section class="thread" id="thread" aria-live="polite"></section>
    <form class="composer" id="composer">
      <div class="composer-inner">
        <textarea id="q" rows="1" placeholder="Pick a document to start asking" disabled aria-label="Your question"></textarea>
        <button class="send" id="send" type="submit" disabled>Ask</button>
      </div>
      <p class="hint">Enter to ask, Shift+Enter for a new line</p>
    </form>
  </main>
</div>

<script>
const API = 'https://dm7jasi2c5.execute-api.us-east-1.amazonaws.com';
const MAX_BYTES = 10 * 1024 * 1024;
const SUGGESTIONS = ['Summarize this document', 'What are the key findings?', 'List the important dates and deadlines'];
const MODE_LABEL = {
  gemini: 'Answered by Gemini',
  bedrock: 'Answered by Amazon Nova',
  none: 'Best matching passage',
  'extractive-fallback': 'AI unavailable, showing best passage',
  'no-match': 'No match in this document',
};
const RETRIEVAL_LABEL = { bm25: 'Keyword search', vector: 'Semantic search' };

const state = { docs: [], selected: null, threads: new Map(), busy: false, pollTimer: null, autoSelect: null };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function api(path, opts) {
  const r = await fetch(API + path, opts);
  let data = {};
  try { data = await r.json(); } catch (_) {}
  if (!r.ok) throw new Error(data.error || data.message || `Request failed (${r.status})`);
  return data;
}

/* ---------- Library ---------- */
const isPending = d => ['UPLOADING', 'PROCESSING'].includes(d.status) && Date.now() / 1000 - (d.createdAt || 0) < 600;

async function loadDocs() {
  clearTimeout(state.pollTimer);
  try {
    state.docs = (await api('/docs')).docs;
  } catch (e) {
    $('docs').innerHTML = `<li class="empty-lib">Couldn't load your library. ${esc(e.message)}</li>`;
    return;
  }
  if (state.autoSelect) {
    const d = state.docs.find(x => x.docId === state.autoSelect);
    if (d && d.status === 'READY') { state.autoSelect = null; select(d.docId); setUpMsg(''); }
    if (d && d.status === 'FAILED') { state.autoSelect = null; setUpMsg(d.error || 'Processing failed.', true); }
  }
  renderDocs();
  if (state.docs.some(isPending)) state.pollTimer = setTimeout(loadDocs, 2500);
}

function docSub(d) {
  if (d.status === 'READY') return `${d.pages} ${d.pages === 1 ? 'page' : 'pages'}`;
  if (d.status === 'PROCESSING') return 'Reading pages';
  if (d.status === 'UPLOADING') return 'Uploading';
  return d.error || 'Processing failed';
}

function renderDocs() {
  if (!state.docs.length) {
    $('docs').innerHTML = '<li class="empty-lib">No documents yet. Add a PDF above to begin.</li>';
    return;
  }
  $('docs').innerHTML = state.docs.map(d => `
    <li><button class="doc" data-id="${esc(d.docId)}" ${d.status !== 'READY' ? 'disabled' : ''}
        aria-current="${d.docId === state.selected}" title="${esc(d.filename)}">
      <span class="doc-name">${esc(d.filename || d.docId)}</span>
      <span class="dot ${esc(d.status)}" aria-label="${esc(d.status.toLowerCase())}"></span>
      <span class="doc-sub ${d.status === 'FAILED' ? 'error' : ''}">${esc(docSub(d))}</span>
    </button></li>`).join('');
}

$('docs').addEventListener('click', e => {
  const btn = e.target.closest('.doc');
  if (btn && !btn.disabled) select(btn.dataset.id);
});

function select(docId) {
  state.selected = docId;
  if (!state.threads.has(docId)) state.threads.set(docId, []);
  renderDocs();
  renderReader();
  $('q').focus();
}

/* ---------- Upload ---------- */
function setUpMsg(text, isError = false) {
  $('upMsg').textContent = text;
  $('upMsg').classList.toggle('error', isError);
}

function putWithProgress(url, file, onProgress) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open('PUT', url);
    x.setRequestHeader('Content-Type', 'application/pdf');
    x.upload.onprogress = e => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
    x.onload = () => (x.status < 300 ? resolve() : reject(new Error(`Upload failed (${x.status}).`)));
    x.onerror = () => reject(new Error('Upload failed. Check your connection and try again.'));
    x.send(file);
  });
}

async function handleFile(file) {
  if (!file) return;
  if (!(file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf'))) return setUpMsg('Only PDF files are supported.', true);
  if (file.size > MAX_BYTES) return setUpMsg('That file is over 10 MB. Try a smaller PDF.', true);

  const bar = $('progress');
  bar.hidden = false;
  bar.firstElementChild.style.width = '0';
  setUpMsg(`Uploading ${file.name}`);
  try {
    const { docId, uploadUrl } = await api(`/upload-url?filename=${encodeURIComponent(file.name)}`);
    await putWithProgress(uploadUrl, file, p => { bar.firstElementChild.style.width = `${Math.round(p * 100)}%`; });
    setUpMsg('Uploaded. Reading pages, this takes a few seconds.');
    state.autoSelect = docId;
    loadDocs();
  } catch (e) {
    setUpMsg(e.message, true);
  } finally {
    setTimeout(() => { bar.hidden = true; }, 600);
    $('file').value = '';
  }
}

const drop = $('drop');
$('file').addEventListener('change', e => handleFile(e.target.files[0]));
drop.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('file').click(); } });
['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => handleFile(e.dataTransfer.files[0]));

/* ---------- Answer rendering ---------- */
function inline(s, msgIdx) {
  return s
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\[p\.?\s*([\dp.,\s]+)\]/gi, (_, inner) =>
      [...inner.matchAll(/\d+/g)].map(m =>
        `<button type="button" class="cite" data-msg="${msgIdx}" data-page="${m[0]}" title="Show the passage from page ${m[0]}">p. ${m[0]}</button>`
      ).join(''));
}

function markdown(text, msgIdx) {
  let html = '', list = null;
  const close = () => { if (list) { html += `</${list}>`; list = null; } };
  for (const raw of esc(text).split('\n')) {
    const line = raw.trimEnd();
    let m;
    if ((m = line.match(/^\s*[*-]\s+(.*)/))) {
      if (list !== 'ul') { close(); html += '<ul>'; list = 'ul'; }
      html += `<li>${inline(m[1], msgIdx)}</li>`;
    } else if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) {
      if (list !== 'ol') { close(); html += '<ol>'; list = 'ol'; }
      html += `<li>${inline(m[1], msgIdx)}</li>`;
    } else if (!line.trim()) {
      close();
    } else {
      close();
      const h = line.match(/^#{1,4}\s+(.*)/);
      html += h ? `<p><strong>${inline(h[1], msgIdx)}</strong></p>` : `<p>${inline(line, msgIdx)}</p>`;
    }
  }
  close();
  return html;
}

function renderSources(sources, msgIdx) {
  if (!sources || !sources.length) return '';
  const max = Math.max(...sources.map(s => s.score));
  const seen = new Set();
  const items = sources.map(s => {
    const id = seen.has(s.page) ? '' : `id="src-${msgIdx}-${s.page}"`;
    seen.add(s.page);
    const pct = max > 0 ? Math.round((s.score / max) * 100) : 0;
    return `<div class="src" ${id}>
      <div class="src-head">Page ${s.page}
        ${max > 0 ? `<span class="bar" title="Relevance"><div style="width:${pct}%"></div></span>` : ''}</div>
      <p>${esc(s.snippet)}…</p></div>`;
  }).join('');
  const label = max > 0 ? `${sources.length} passages used` : 'Passages from the opening of the document';
  return `<details class="sources"><summary>${label}</summary><div class="src-list">${items}</div></details>`;
}

function renderAnswer(m, i) {
  if (m.pending) return '<div class="thinking">Reading the relevant pages</div>';
  if (m.error) return `<div class="a error">${esc(m.error)}</div>`;
  const note = m.mode === 'extractive-fallback'
    ? '<div class="note">The AI model is unavailable right now, so here is the most relevant passage instead.</div>' : '';
  const pills = [MODE_LABEL[m.mode] || m.mode, RETRIEVAL_LABEL[m.retrieval], `${(m.latencyMs / 1000).toFixed(1)} s`]
    .filter(Boolean).map(t => `<span class="pill">${esc(t)}</span>`).join('');
  return `<div class="a">${note}${markdown(m.answer, i)}</div>
    <div class="meta">${pills}</div>${renderSources(m.sources, i)}`;
}

/* ---------- Reader ---------- */
function renderReader() {
  const doc = state.docs.find(d => d.docId === state.selected);
  const thread = $('thread');
  const q = $('q');

  if (!doc) {
    $('head').innerHTML = '<h2>No document selected</h2>';
    thread.innerHTML = `<div class="welcome"><h3>Ask questions about any PDF</h3>
      <p>Add a PDF on the left, or pick one from your library. Answers come with the pages they're based on.</p></div>`;
    q.disabled = true; q.placeholder = 'Pick a document to start asking';
    updateSend();
    return;
  }

  const msgs = state.threads.get(doc.docId);
  $('head').innerHTML = `<h2 title="${esc(doc.filename)}">${esc(doc.filename)}</h2>
    <span class="pages">${esc(docSub(doc))}</span>
    ${msgs.length ? '<button class="clear" id="clear" type="button">Clear conversation</button>' : ''}`;
  q.disabled = false; q.placeholder = `Ask about ${doc.filename}`;

  if (!msgs.length) {
    thread.innerHTML = `<div class="welcome"><h3>What do you want to know?</h3>
      <p>Ask anything about this document, or start with one of these.</p>
      <div class="suggest">${SUGGESTIONS.map(s => `<button type="button" data-q="${esc(s)}">${esc(s)}</button>`).join('')}</div></div>`;
  } else {
    thread.innerHTML = `<div class="thread-inner">${msgs.map((m, i) =>
      m.role === 'q' ? `<div class="q">${esc(m.text)}</div>` : `<div>${renderAnswer(m, i)}</div>`).join('')}</div>`;
    thread.scrollTop = thread.scrollHeight;
  }
  updateSend();
}

$('head').addEventListener('click', e => {
  if (e.target.id === 'clear') { state.threads.set(state.selected, []); renderReader(); }
});

$('thread').addEventListener('click', e => {
  const s = e.target.closest('.suggest button');
  if (s) return ask(s.dataset.q);
  const c = e.target.closest('.cite');
  if (!c) return;
  const src = document.getElementById(`src-${c.dataset.msg}-${c.dataset.page}`);
  if (!src) return;
  src.closest('details').open = true;
  src.scrollIntoView({ behavior: 'smooth', block: 'center' });
  src.classList.remove('flash'); void src.offsetWidth; src.classList.add('flash');
});

/* ---------- Asking ---------- */
async function ask(question) {
  question = question.trim();
  if (!question || !state.selected || state.busy) return;
  const docId = state.selected;
  const msgs = state.threads.get(docId);
  const answer = { role: 'a', pending: true };
  msgs.push({ role: 'q', text: question }, answer);
  state.busy = true;
  $('q').value = ''; autosize();
  renderReader();
  try {
    Object.assign(answer, await api('/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ docId, question }),
    }));
  } catch (e) {
    answer.error = `Couldn't get an answer: ${e.message}`;
  } finally {
    answer.pending = false;
    state.busy = false;
    if (state.selected === docId) renderReader();
  }
}

function updateSend() { $('send').disabled = $('q').disabled || state.busy || !$('q').value.trim(); }
function autosize() { const q = $('q'); q.style.height = 'auto'; q.style.height = `${q.scrollHeight}px`; }

$('composer').addEventListener('submit', e => { e.preventDefault(); ask($('q').value); });
$('q').addEventListener('input', () => { autosize(); updateSend(); });
$('q').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask($('q').value); }
});

renderReader();
loadDocs();
</script>
</body>
</html>
